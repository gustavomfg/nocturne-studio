name: Release · stable

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stable-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  source-gate:
    name: Verify main, version and completed CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Require current main and matching stable version
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a stable tag such as v1.0.2.' >&2; exit 1; }
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG" || { echo 'Run the stable release from its existing tag.' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RELEASE_SHA"
          test "$(git ls-remote origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')" = "$RELEASE_SHA" || { echo 'The remote tag must point directly to this commit.' >&2; exit 1; }
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$RELEASE_SHA" || { echo 'Tag the current main commit after its CI passes.' >&2; exit 1; }
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")" || { echo 'Tag does not match package.json.' >&2; exit 1; }
          test -f "docs/releases/$RELEASE_TAG.md" || { echo 'Versioned release notes are missing.' >&2; exit 1; }
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$RELEASE_TAG is already published; stable release never replaces it." >&2
            exit 1
          fi
      - name: Require successful main CI for this exact commit
        shell: bash
        run: |
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/package-validation.yml/runs" \
            -f head_sha="$RELEASE_SHA" -f branch=main -f event=push -f per_page=100 |
            node -e '
              const fs = require("node:fs")
              const runs = JSON.parse(fs.readFileSync(0, "utf8")).workflow_runs
                .filter((run) => run.head_sha === process.env.RELEASE_SHA && run.event === "push")
                .sort((a, b) => b.id - a.id)
              const latest = runs[0]
              if (!latest) throw new Error("No main CI push run exists for this commit. Wait for CI before releasing.")
              if (latest.conclusion !== "success") throw new Error("Main CI run " + latest.html_url + " is " + latest.status + "/" + (latest.conclusion || "pending") + ".")
              console.log("Verified main CI: " + latest.html_url)
            '
      - run: npm ci --ignore-scripts
      - run: npm run verify:release-metadata

  signed-package:
    name: Package and attest (${{ matrix.platform }}, ${{ matrix.os }})
    needs: source-gate
    environment: stable-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            architecture: x64
          - os: windows-latest
            platform: windows
            architecture: x64
          - os: macos-latest
            platform: macos
            architecture: arm64
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      APPLE_ID: ''
      APPLE_APP_SPECIFIC_PASSWORD: ''
      APPLE_TEAM_ID: ''
      APPLE_API_KEY: ''
      APPLE_API_KEY_ID: ''
      APPLE_API_ISSUER: ''
      APPLE_KEYCHAIN_PROFILE: ''
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Require the validated source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
      - name: Require Linux signing credentials
        if: matrix.platform == 'linux'
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          test -n "$GPG_PRIVATE_KEY"
          test -n "$GPG_PASSPHRASE"
      - name: Confirm unsigned platform policy
        if: matrix.platform != 'linux'
        shell: bash
        run: |
          test -z "${CSC_LINK:-}"
          test -z "${WIN_CSC_LINK:-}"
          test -z "${APPLE_ID:-}"
          test -z "${APPLE_API_KEY:-}"
          echo "${{ matrix.platform }} artifacts are intentionally unsigned under the current release policy."
      - run: npm ci
      - name: Import Linux release key
        if: matrix.platform == 'linux'
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
      - run: npm run package -- --publish never
      - name: Smoke test packaged application (Linux)
        if: matrix.platform == 'linux'
        run: xvfb-run -a npm run smoke:package
      - name: Smoke test packaged application
        if: matrix.platform != 'linux'
        run: npm run smoke:package
      - name: Verify packaged updater identity
        shell: bash
        run: node scripts/verify-packaged-metadata.mjs --platform "$RELEASE_PLATFORM" --architecture "${{ matrix.architecture }}"
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
      - run: npm run checksums
      - name: Sign Linux checksums
        if: matrix.platform == 'linux'
        shell: bash
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --detach-sign --output "release/${RELEASE_TAG#v}/SHA256SUMS.sig" "release/${RELEASE_TAG#v}/SHA256SUMS"
      - name: Verify Linux signature
        if: matrix.platform == 'linux'
        run: npm run verify:signatures
      - name: Stage exact platform inventory
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: node scripts/stage-release-assets.mjs --platform "$RELEASE_PLATFORM" --release-directory "release/${RELEASE_TAG#v}" --output release-output
      - name: Verify exact platform inventory
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: node scripts/verify-release-assets.mjs --platform "$RELEASE_PLATFORM" release-output
      - uses: actions/upload-artifact@v7
        with:
          name: nocturne-stable-${{ matrix.platform }}-${{ runner.arch }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Verify and publish stable release
    needs: signed-package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: nocturne-stable-*
          path: release-assets
          merge-multiple: true
      - name: Normalize platform artifact layout
        shell: bash
        run: |
          while IFS= read -r -d '' artifact_file; do
            artifact_name="$(basename "$artifact_file")"
            target="release-assets/$artifact_name"
            if [ "$artifact_file" != "$target" ]; then
              test ! -e "$target"
              mv -- "$artifact_file" "$target"
            fi
          done < <(find release-assets -mindepth 1 -type f -print0)
          find release-assets -mindepth 1 -type d -empty -delete
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify:release-assets -- release-assets
      - name: Verify Linux signature with the public release key
        shell: bash
        run: |
          keyring="$(mktemp -d)"
          chmod 700 "$keyring"
          gpg --homedir "$keyring" --batch --import docs/release-signing-public.asc
          gpg --homedir "$keyring" --batch --verify release-assets/SHA256SUMS-Linux.sig release-assets/SHA256SUMS-Linux
      - name: Publish verified assets from the exact tag
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git ls-remote origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')" = "$RELEASE_SHA" || { echo 'The tag changed; refusing publication.' >&2; exit 1; }
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$RELEASE_SHA" || { echo 'main advanced during packaging; release stopped.' >&2; exit 1; }
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'The release already exists; refusing to replace published assets.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --notes-file "docs/releases/$RELEASE_TAG.md" --title "Nocturne Studio $RELEASE_TAG"
      - name: Verify published tag, notes and asset digests
        run: node scripts/verify-published-release.mjs release-assets
