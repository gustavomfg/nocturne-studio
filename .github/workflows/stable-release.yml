name: Release · stable

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable tag selected in "Use workflow from" (for example v1.0.1)
        required: true
        type: string
      codex_smoke_run_id:
        description: Successful Codex contract smoke run ID for the exact release commit
        required: true
        type: string
      candidate_sha:
        description: Full candidate commit SHA validated by source and Codex gates
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: stable-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  source-gate:
    name: Verify release source and Codex contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CODEX_SMOKE_RUN_ID: ${{ inputs.codex_smoke_run_id }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Require a stable version and matching tag
        shell: bash
        run: |
          node -e "const v=require('./package.json').version;const tag=process.env.RELEASE_TAG;const sha=(process.env.CANDIDATE_SHA||'').trim();if(v.includes('-'))throw new Error('Stable signing requires a version without a prerelease suffix: '+v);if(tag !== 'v'+v)throw new Error('Tag '+tag+' does not match package version v'+v);if(!/^[0-9a-f]{40}$/.test(sha))throw new Error('candidate_sha must be a lowercase full commit SHA')"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$CANDIDATE_SHA"
      - name: Require a successful Codex smoke for this commit
        shell: bash
        run: |
          expected_sha="$CANDIDATE_SHA"
          run_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CODEX_SMOKE_RUN_ID" --jq .head_sha)"
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CODEX_SMOKE_RUN_ID" --jq .conclusion)"
          event="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CODEX_SMOKE_RUN_ID" --jq .event)"
          workflow_path="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CODEX_SMOKE_RUN_ID" --jq .path)"
          test "$run_sha" = "$expected_sha"
          test "$conclusion" = success
          test "$event" = workflow_dispatch
          test "$workflow_path" = .github/workflows/codex-contract-smoke.yml
      - name: Verify the sanitized Codex smoke evidence
        shell: bash
        run: |
          evidence_dir="$(mktemp -d)"
          gh run download "$CODEX_SMOKE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "codex-contract-smoke-$CODEX_SMOKE_RUN_ID" \
            --dir "$evidence_dir"
          report_path="$(find "$evidence_dir" -type f -name codex-contract-smoke.json -print -quit)"
          test -n "$report_path"
          EXPECTED_SHA="$CANDIDATE_SHA" REPORT_PATH="$report_path" node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8'))
          const expectedSha = process.env.EXPECTED_SHA
          const required = [
            'appServerHandshake',
            'authenticationChecked',
            'authenticatedSession',
            'modelList',
            'configRead',
            'requestResponseContract',
            'cleanShutdown',
            'shutdown',
            'minimumSatisfied',
            'sessionStarted',
            'threadStart',
            'turnStart',
            'turnCompleted',
            'agentResponse',
            'interrupt',
          ]
          if (report.ok !== true) throw new Error('O relatório do smoke Codex não está marcado como bem-sucedido.')
          if (report.repositorySha !== expectedSha || report.expectedSha !== expectedSha) throw new Error('O relatório Codex não corresponde ao SHA da release.')
          if (report.nocturneVersion !== require('./package.json').version) throw new Error('O relatório Codex não corresponde à versão da release.')
          if (!/^\d+\.\d+\.\d+$/.test(report.codexVersion || '')) throw new Error('O relatório Codex não informa uma versão semântica válida.')
          for (const key of required) if (report[key] !== true) throw new Error(`Evidência Codex incompleta: ${key}`)
          if (report.authenticationMethod === '') throw new Error('O relatório Codex não informa uma autenticação verificada.')
          if (report.unexpectedStdoutLines !== 0) throw new Error('O App Server emitiu linhas stdout fora do protocolo JSONL.')
          NODE
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run verify:release-metadata
      - name: Install Playwright Chromium without stale third-party apt indexes
        shell: bash
        run: |
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -qi 'dl.google.com/linux/chrome' "$source"; then
              sudo rm -f "$source"
            fi
          done
          npx playwright install --with-deps chromium
      - run: npm run test:renderer

  signed-package:
    name: Package and attest (${{ matrix.platform }}, ${{ matrix.os }})
    needs: source-gate
    environment: stable-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            architecture: x64
            checksum_suffix: Linux
          - os: windows-latest
            platform: windows
            architecture: x64
            checksum_suffix: Windows
          - os: macos-latest
            platform: macos
            architecture: arm64
            checksum_suffix: macOS
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_LINK: ''
      WIN_CSC_LINK: ''
      APPLE_ID: ''
      APPLE_APP_SPECIFIC_PASSWORD: ''
      APPLE_TEAM_ID: ''
      APPLE_API_KEY: ''
      APPLE_API_KEY_ID: ''
      APPLE_API_ISSUER: ''
      APPLE_KEYCHAIN_PROFILE: ''
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Require a stable version
        shell: bash
        run: |
          node -e "const v=require('./package.json').version;const tag=process.env.RELEASE_TAG;const sha=(process.env.CANDIDATE_SHA||'').trim();if(v.includes('-'))throw new Error('Stable signing requires a version without a prerelease suffix: '+v);if(tag !== 'v'+v)throw new Error('Tag '+tag+' does not match package version v'+v);if(!/^[0-9a-f]{40}$/.test(sha))throw new Error('candidate_sha must be a lowercase full commit SHA')"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$CANDIDATE_SHA"
      - name: Require platform signing credentials
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          test -n "$GPG_PRIVATE_KEY"
          test -n "$GPG_PASSPHRASE"
      - name: Confirm unsigned platform policy
        if: matrix.platform != 'linux'
        shell: bash
        run: |
          test -z "$CSC_LINK"
          test -z "$WIN_CSC_LINK"
          test -z "$APPLE_ID"
          test -z "$APPLE_API_KEY"
          echo "${{ matrix.platform }} artifacts are intentionally unsigned under the current release policy."
      - run: npm ci
      - name: Import Linux release key
        if: matrix.platform == 'linux'
        shell: bash
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import
      - run: npm run package -- --publish never
      - name: Smoke test packaged application (Linux)
        if: matrix.platform == 'linux'
        run: xvfb-run -a npm run smoke:package
      - name: Smoke test packaged application
        if: matrix.platform != 'linux'
        run: npm run smoke:package
      - name: Verify packaged updater identity
        shell: bash
        run: node scripts/verify-packaged-metadata.mjs --platform "$RELEASE_PLATFORM" --architecture "${{ matrix.architecture }}"
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
      - run: npm run checksums
      - name: Sign Linux checksums
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --detach-sign --output "release/$version/SHA256SUMS.sig" "release/$version/SHA256SUMS"
      - name: Verify Linux signature
        if: matrix.platform == 'linux'
        run: npm run verify:signatures
      - name: Preserve platform checksum manifest
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          checksum_name="SHA256SUMS-${{ matrix.checksum_suffix }}"
          mv "release/$version/SHA256SUMS" "release/$version/$checksum_name"
          if [ -f "release/$version/SHA256SUMS.sig" ]; then mv "release/$version/SHA256SUMS.sig" "release/$version/$checksum_name.sig"; fi
      - name: Stage exact platform inventory
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: node scripts/stage-release-assets.mjs --platform "$RELEASE_PLATFORM" --release-directory "release/$(node -p "require('./package.json').version")" --output release-output
      - name: Verify exact platform inventory
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: node scripts/verify-release-assets.mjs --platform "$RELEASE_PLATFORM" release-output
      - uses: actions/upload-artifact@v7
        with:
          name: nocturne-stable-${{ matrix.platform }}-${{ runner.arch }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 14

  stable-gate:
    name: Verify and publish stable release
    needs: signed-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Require the verified candidate SHA
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$CANDIDATE_SHA"
      - uses: actions/download-artifact@v8
        with:
          pattern: nocturne-stable-*
          path: release-assets
          merge-multiple: true
      - name: Normalize platform artifact layout
        shell: bash
        run: |
          while IFS= read -r -d '' artifact_file; do
            artifact_name="$(basename "$artifact_file")"
            target="release-assets/$artifact_name"
            if [ "$artifact_file" != "$target" ]; then
              test ! -e "$target"
              mv -- "$artifact_file" "$target"
            fi
          done < <(find release-assets -mindepth 1 -type f -print0)
          find release-assets -mindepth 1 -type d -empty -delete
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify:release-assets -- release-assets
      - name: Publish verified assets
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A release existente não é alterada pelo stable workflow; use o fluxo de backfill para reconciliação." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --notes-file "docs/releases/$RELEASE_TAG.md" --title "Nocturne Studio $RELEASE_TAG"
